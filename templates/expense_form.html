{% extends "base.html" %}
{% block title %}{{ mode }} expense · Pocketwise{% endblock %}
{% block content %}
<section class="form-page">
  <a class="back-link" href="{{ url_for('dashboard') }}">← Back to overview</a>
  <div class="form-intro"><div class="eyebrow"><span class="eyebrow-dot"></span> TRANSACTION DETAILS</div><h1>{{ mode }} an <span>expense.</span></h1><p>Keep the details accurate so your overview stays useful.</p></div>
  <form class="panel expense-form" method="post">
    <div class="form-grid">
      <label class="form-field full-width">Expense title <span>*</span><input type="text" name="title" maxlength="100" placeholder="e.g. Weekly groceries" required value="{{ expense.title if expense else request.form.get('title', '') }}"></label>
      <label class="form-field">Amount (₹) <span>*</span><input type="number" name="amount" min="0.01" max="999999999.99" step="0.01" placeholder="0.00" required value="{{ expense.amount if expense else request.form.get('amount', '') }}"></label>
      <label class="form-field">Category <span>*</span><select name="category" required><option value="">Choose category</option>{% for item in categories %}<option value="{{ item }}" {% if expense and expense.category == item %}selected{% elif request.form.get('category') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
      <label class="form-field">Date <span>*</span><input type="date" name="expense_date" required value="{{ expense.expense_date.isoformat() if expense and expense.expense_date.isoformat is defined else (expense.expense_date if expense else request.form.get('expense_date', today)) }}"></label>
      <label class="form-field">Payment method<select name="payment_method">{% for item in ['UPI', 'Cash', 'Debit Card', 'Credit Card', 'Net Banking', 'Other'] %}<option value="{{ item }}" {% if expense and expense.payment_method == item %}selected{% elif not expense and item == 'UPI' %}selected{% elif request.form.get('payment_method') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
      <label class="form-field full-width">Notes <span class="optional">(optional)</span><textarea name="notes" rows="3" maxlength="500" placeholder="Add a little context...">{{ expense.notes if expense else request.form.get('notes', '') }}</textarea></label>
    </div>
    <div class="form-actions"><a href="{{ url_for('dashboard') }}" class="button button-quiet">Cancel</a><button class="button button-primary" type="submit">{{ 'Save changes' if mode == 'Edit' else 'Save expense' }} →</button></div>
  </form>
</section>
{% endblock %}
