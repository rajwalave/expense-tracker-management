{% extends "base.html" %}
{% block title %}Database connection issue · Pocketwise{% endblock %}
{% block content %}
<section class="error-state panel">
  <div class="empty-icon">!</div><h1>We couldn't reach the database.</h1>
  <p>Make sure MySQL is running, the database has been created from <code>schema.sql</code>, and your DB environment variables are correct.</p>
  <a class="button button-primary" href="{{ url_for('dashboard') }}">Try again</a>
</section>
{% endblock %}
